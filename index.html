<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAREFAS — Meu Assistente</title>
<style>
:root{--bgimg:none;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3fb;--sf:#ffffff;--sf2:#f4f8fe;--tx:#0b1b33;--mu:#5b6b85;--br:#0a3d91;--ac:#1a6cf0;--bd:#e1e8f4;--ok:#12a150;--wn:#e08a00;--er:#d93025;--ye:#ffd100;
--sh:0 1px 2px rgba(10,42,99,.06),0 10px 28px rgba(10,42,99,.07);--nv1:#0a2a63;--nv2:#0b44a3;--ease:cubic-bezier(.22,1,.36,1);
--f1:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f2:"Sora","Figtree",system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a1424;--sf:#12203a;--sf2:#0e1a31;--tx:#e8eefb;--mu:#93a4c4;--br:#5aa2ff;--ac:#4d94ff;--bd:#23365a;--sh:0 1px 2px #0007,0 10px 28px #0006;--nv1:#071a3d;--nv2:#0b2a63;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a1424;--sf:#12203a;--sf2:#0e1a31;--tx:#e8eefb;--mu:#93a4c4;--br:#5aa2ff;--ac:#4d94ff;--bd:#23365a;--sh:0 1px 2px #0007,0 10px 28px #0006;--nv1:#071a3d;--nv2:#0b2a63;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--f1);-webkit-font-smoothing:antialiased}
header{display:flex;gap:12px;align-items:center;height:60px;padding:0 16px 0 20px;background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--ye),#ffb800);color:#0a2a63;display:grid;place-items:center;font-weight:800;box-shadow:0 4px 12px rgba(255,184,0,.4)}
.brand b{font:800 17px var(--f2);letter-spacing:.04em;color:var(--br)}.brand small{color:var(--mu);font-size:13px}
header input{flex:1;min-width:0;max-width:360px;margin-left:auto;padding:9px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;transition:border-color .2s,box-shadow .2s}
header input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
button{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:6px 13px;transition:transform .15s var(--ease),background .2s,box-shadow .2s,border-color .2s}
button:hover{border-color:var(--ac);transform:translateY(-1px)}button:active{transform:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a.btn{display:inline-block;font-weight:500;text-decoration:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:6px 13px;-webkit-tap-highlight-color:transparent}
button.p{background:linear-gradient(135deg,var(--ac),var(--br));color:#fff;border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 35%,transparent)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
#th,#mb{width:38px;height:38px;padding:0;border-radius:12px;display:grid;place-items:center}#mb{display:none}
.app{padding-left:96px;min-height:calc(100vh - 60px)}
nav{position:fixed;left:12px;top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:64px;overflow:hidden auto;padding:12px 8px;border-radius:24px;background:radial-gradient(120% 60% at 0% 0%,rgba(255,209,0,.16),transparent 60%),linear-gradient(170deg,var(--nv2),var(--nv1));box-shadow:0 12px 40px rgba(7,26,61,.35),inset 0 0 0 1px rgba(255,255,255,.08);transition:width .32s var(--ease),transform .32s var(--ease),box-shadow .32s;z-index:6;scrollbar-width:none}
nav:hover,nav:focus-within{width:240px;box-shadow:0 18px 50px rgba(7,26,61,.5),inset 0 0 0 1px rgba(255,255,255,.1)}
nav button{position:relative;display:flex;gap:12px;align-items:center;width:100%;margin-bottom:4px;text-align:left;white-space:nowrap;border:0;background:none;color:#dbe6ff;padding:6px;border-radius:16px;transform:none}
nav button:hover{background:rgba(255,255,255,.09);transform:none}
nav .i{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--c,#4da3ff) 26%,transparent);transition:transform .25s var(--ease)}
nav button:hover .i{transform:scale(1.08)}
nav .n,nav .c{opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .3s var(--ease)}
nav .c:empty{display:none}nav .n{flex:1;font-weight:600;font-size:14px}nav .c{font-size:12px;min-width:24px;text-align:center;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.16);margin-right:6px}
nav:hover .n,nav:hover .c,nav:focus-within .n,nav:focus-within .c,nav.open .n,nav.open .c{opacity:1;transform:none;transition-delay:.06s}
nav button.on{background:rgba(255,255,255,.16);color:#fff}
nav button.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ye)}
nav button:nth-child(1){--c:#4da3ff}nav button:nth-child(2){--c:#ff6b6b}nav button:nth-child(3){--c:#ffd100}nav button:nth-child(4){--c:#8c9bff}nav button:nth-child(5){--c:#ffa94d}nav button:nth-child(6){--c:#3ddc97}nav button:nth-child(7){--c:#b38cff}nav button:nth-child(8){--c:#5fd0e8}nav button:nth-child(9){--c:#a9bbdc}
#bd{position:fixed;inset:0;background:rgba(5,14,32,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
main{padding:20px 20px 48px;max-width:1040px;margin:0 auto;width:100%}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.card.hero{background:linear-gradient(180deg,rgba(7,26,61,.3),rgba(7,26,61,.82));backdrop-filter:blur(2px);color:#fff;border:0;min-height:310px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h2{font:700 22px var(--f2);letter-spacing:-.01em}.hero .mu,.hero .log{color:#c6d6f7}
.hero .chat input{background:rgba(255,255,255,.96);color:#0b1b33;border:0;padding:12px 16px;border-radius:999px}.hero .chat input::placeholder{color:#6b7a94}
.hero a.btn{display:inline-block;font-weight:500;text-decoration:none;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:999px;padding:6px 13px;-webkit-tap-highlight-color:transparent}
button.p{background:var(--ye);color:#0a2a63;box-shadow:0 4px 14px rgba(255,209,0,.4);font-weight:700}
h2{margin:0 0 10px;font:700 16px var(--f2);letter-spacing:-.01em}.mu{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.row:first-of-type{border-top:0}.row .g{flex:1;min-width:180px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff;background:var(--mu);letter-spacing:.02em}
.critica{background:var(--er)}.alta{background:var(--wn)}.media{background:var(--ac)}.baixa{background:var(--mu)}
.ok{color:var(--ok)}.late{color:var(--er)}
.chat{display:flex;gap:8px;margin-top:12px}.chat input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit}
.log{font-size:13px;margin-top:10px;color:var(--mu);white-space:pre-wrap}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),#5be39b);transition:width .6s var(--ease)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{margin:0;padding:16px 18px;position:relative;overflow:hidden}.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--kc);opacity:.16}
.kv{font:800 32px/1.1 var(--f2);color:var(--kc)}.k0{--kc:var(--ac)}.k1{--kc:var(--er)}.k2{--kc:var(--ok)}
#toast{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:9;max-width:340px}
#toast>div{background:var(--sf);border:1px solid var(--wn);border-radius:16px;padding:12px;box-shadow:0 12px 32px #0004}
a{color:var(--ac)}input[type=text],input[type=time],input[type=date],textarea{padding:7px 10px;border-radius:12px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit}
@media(max-width:700px){.app{padding-left:0}nav,nav:hover{width:272px}nav{left:10px;transform:translateX(-120%)}nav.open{transform:none}nav.open~#bd{opacity:1;pointer-events:auto}nav .n,nav .c{opacity:1;transform:none}#mb{display:grid}.brand small{display:none}.kpis{grid-template-columns:1fr 1fr 1fr;gap:8px}.kv{font-size:24px}main{padding:14px 14px 40px}header{padding:0 12px}}
.chk{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--bd);border-radius:999px;cursor:pointer;color:var(--tx);font-size:14px}.chk input{width:auto;margin:0}
@media(max-width:700px){.card.hero{min-height:290px;background:linear-gradient(180deg,rgba(7,26,61,.3),rgba(7,26,61,.86))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

[hidden]{display:none!important}
#bgp{position:fixed;inset:0;z-index:0;background:var(--bg) center/cover no-repeat}
#bgp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,42,.5),rgba(6,18,42,.3) 40%,rgba(6,18,42,.58))}
.card{background:color-mix(in srgb,var(--sf) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.logo img{height:36px;max-width:180px}
.app{position:relative;z-index:1}
.card.hero{position:relative;overflow:hidden}.card.hero>*{position:relative;z-index:1}
.logo.img{background:none;box-shadow:none;width:auto;border-radius:0}.logo img{height:32px;display:block;max-width:140px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.ch h2{margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{min-width:54px;padding:8px 12px}.chip.on{background:linear-gradient(135deg,var(--ac),var(--br));color:#fff;border-color:transparent}.chip:disabled{cursor:default;transform:none}.chip:disabled:not(.on){opacity:.55}
.fl2{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.fl2 label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
#md{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:rgba(5,14,32,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:20}
#mf{width:min(440px,100%);max-height:90vh;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:22px;padding:22px;box-shadow:0 24px 60px #0006;display:grid;gap:12px}
#mf h2{margin:0}.fl{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.fl input,.fl select,.fl textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit}.fl textarea{min-height:64px}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}.er{color:var(--er);font-size:13px}.er:empty{display:none}
</style></head><body>

async function fEd(id){const c=S.cfg;c.fl=c.fl||[];const f=c.fl.find(x=>x.id==id)||{t:'d',a:today(),n:1};
 const v=await dlg(id?'Editar folga':'Nova folga',[{l:'Tipo',type:'select',v:f.t,opts:[['d','Dia único'],['p','Período (de/até)'],['s','Repetir toda semana']]},{l:'Data (início ou primeira folga)',type:'date',v:f.a},{l:'Até',type:'date',v:f.b||'',w:'p'},{l:'Repetição',type:'select',v:String(f.n||1),opts:[['1','Toda semana'],['2','A cada 2 semanas'],['3','A cada 3 semanas'],['4','A cada 4 semanas']],w:'s'},{l:'Motivo (opcional)',v:f.m||''}],'Confirmar','',x=>!x[1]?'Informe a data.':x[0]=='p'&&(!x[2]||x[2]<x[1])?'A data final deve ser igual ou depois da inicial.':'');
 if(!v)return;const o={id:f.id||'f'+Date.now(),t:v[0],a:v[1],m:v[4].trim()};if(v[0]=='p')o.b=v[2];if(v[0]=='s')o.n=+v[3];
 const i=c.fl.findIndex(x=>x.id==o.id);i<0?c.fl.push(o):c.fl[i]=o;save();note('Folga salva.')}

function bgUp(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(1000,im.width||1000),hh=Math.round((im.height||1000)*w/(im.width||1000)),cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(im,0,0,w,hh);S.cfg.bg=cv.toDataURL('image/jpeg',.72);save();note('Foto atualizada.')};im.onerror=()=>note('Não consegui ler essa imagem.');im.src=rd.result};rd.readAsDataURL(f)}
function logoUp(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const hh=Math.min(64,im.height||64),w=Math.round((im.width||64)*hh/(im.height||64)),cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(im,0,0,w,hh);S.cfg.logo=cv.toDataURL('image/png');save();note('Logo atualizado.')};im.onerror=()=>note('Não consegui ler essa imagem. Use PNG, JPG ou SVG.');im.src=rd.result};rd.readAsDataURL(f)}
function tick(){const d=today(),n=new Date(),hm=n.toTimeString().slice(0,5);if(isOff(d)||hm<S.cfg.ini||hm>S.cfg.fim)return;
 const fr=S.cfg.freq||60,pre=S.cfg.pre==null?15:S.cfg.pre,mn=n.getHours()*60+n.getMinutes();S.tasks.filter(t=>t.status=='pendente'&&t.date<=d).forEach(t=>{const due=t.date<d||!t.time||t.time<=hm,soon=!due&&t.time&&t.date==d&&(+t.time.slice(0,2))*60+(+t.time.slice(3))-mn<=pre,kind=due?(t.date<d?'late':'due'):soon?'pre':null;if(!kind)return;const k=t.id+t.date+kind,last=notified[k];if(last&&(kind!='late'||Date.now()-last<fr*6e4))return;notified[k]=Date.now();alertT(t,kind)})}
function alertT(t,kind){[t].forEach(t=>{const e=document.createElement('div');e.innerHTML=`<b>${esc(t.t)}</b><div class="mu">${kind=='pre'?'Começa em breve':kind=='late'?'Atrasada':'Agora'}: você já verificou esta atividade?</div>${t.link?`<a class="btn" href="${esc(t.link)}" target="_blank" rel="noopener">Abrir atividade</a> `:''}<button class="p">Concluir</button> <button>Adiar</button>`;const b=e.querySelectorAll('button');b[b.length-2].onclick=()=>{act(t.id,'ok');e.remove()};b[b.length-1].onclick=()=>{act(t.id,'adiar');e.remove()};$('#toast').append(e);try{if(Notification.permission=='granted')new Notification('TAREFAS',{body:t.t})}catch(x){}})}
async function ics(id){const t=S.tasks.find(x=>x.id==id);if(!t)return;const dl={save:async o=>{const a=document.createElement('a');a.href=URL.createObjectURL(o.data);a.download=o.filename;document.body.append(a);a.click();setTimeout(()=>a.remove(),500)}};
 const p2=n=>String(n).padStart(2,'0'),f=d=>`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`,sd=new Date(t.date+'T'+(t.time||S.cfg.ini)+':00'),ed=new Date(sd.getTime()+15*6e4),dn=['SU','MO','TU','WE','TH','FR','SA'];
 const x=s=>String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,'\\$&').replace(/\n/g,'\\n'),fo=l=>l.length>70?l.match(/.{1,70}/g).join('\r\n '):l;
 const rr=t.rec=='diaria'?'RRULE:FREQ=DAILY;BYDAY='+S.cfg.dias.map(i=>dn[i]).join(','):t.rec=='semanal'?'RRULE:FREQ=WEEKLY':t.rec=='dias'?'RRULE:FREQ=WEEKLY;BYDAY='+(t.rd||[]).map(i=>dn[i]).join(','):'';
 const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TAREFAS//PT','BEGIN:VTIMEZONE','TZID:America/Recife','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:-0300','TZOFFSETTO:-0300','TZNAME:-03','END:STANDARD','END:VTIMEZONE','BEGIN:VEVENT','UID:tarefas-'+t.id+'@tarefas','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,''),'DTSTART;TZID=America/Recife:'+f(sd),'DTEND;TZID=America/Recife:'+f(ed),...(rr?[rr]:[]),'SUMMARY:'+x(t.t),...(t.link?['DESCRIPTION:'+x('Abrir: '+t.link),'URL:'+t.link]:[]),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+x(t.t),'TRIGGER:-PT5M','END:VALARM','END:VEVENT','END:VCALENDAR'].map(fo).join('\r\n')+'\r\n';
 dl.save({filename:'tarefa-'+t.id+'.ics',data:new Blob([body],{type:'text/calendar'})}).catch(()=>{})}
function homeExtra(){const d=today(),hm=new Date().toTimeString().slice(0,5),T=S.tasks,pe=T.filter(t=>t.status=='pendente');
 const nx=R.filter(r=>(!rdays(r)||rdays(r).includes(new Date().getDay()))&&!(S.skip||{})[d+':'+r.id]&&S.done[d+':'+r.id]!='ok'&&!isOff(d)).map(r=>[S.cfg.rh[r.id]||r.h,r.t]).filter(x=>x[0]>=hm).sort()[0];
 const DS=dayStats(),kp=[['A concluir hoje',DS.todo],['Atrasadas',DS.late],['Concluídas hoje',DS.done]].map(([a,b],k)=>`<div class="card kpi k${k}"><div class="kv">${b}</div><div class="mu">${a}</div></div>`).join('');
 const pr=pe.filter(t=>t.prio=='critica'||t.prio=='alta').slice(0,5),pl=pe.filter(t=>t.date>d||(t.date==d&&(t.time||'99')>=hm)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,4);
 return `<div class="card"><h2>Próximo compromisso</h2>${nx?`<b>${nx[0]}</b> · ${esc(nx[1])}`:'<span class="mu">Nada mais na rotina de hoje.</span>'}</div><div class="kpis">${kp}</div><div class="card"><h2>Prioritárias</h2>${pr.map(taskRow).join('')||'<div class="mu">Nenhuma.</div>'}</div><div class="card"><h2>Próximos lembretes</h2>${pl.map(t=>`<div class="row"><div class="g">${esc(t.t)}</div><span class="mu">${t.date.split('-').reverse().join('/')} ${t.time||''}</span></div>`).join('')||'<div class="mu">Nenhum.</div>'}</div><div class="card"><h2>Acesso rápido</h2><div style="display:flex;flex-wrap:wrap;gap:8px">${[['Presença',L.pres],['Reunião',L.reun],['Avarias (planilha)',L.ava],['Aduanas',L.adu],['Painel avarias',L.pav],['Feedbacks',L.fee],['Inventário',L.inv],['Pacotes',L.pkg]].map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener"><button>${n}</button></a>`).join('')}</div></div>`}

 const bl=c.b.map((b,i)=>`<div class="row">${b.k=='check'?`<label class="g"><input type="checkbox" ${b.v?'checked':''} onchange="pb(${i},'v')"> ${esc(b.x)}</label>`:b.k=='link'?`<a class="g" href="${esc(b.u)}" target="_blank" rel="noopener">${esc(b.x)}</a>`:b.k=='tab'?`<table class="g" style="border-collapse:collapse">${b.rows.map(r=>`<tr>${r.map(x=>`<td style="border:1px solid var(--bd);padding:4px 8px">${esc(x)}</td>`).join('')}</tr>`).join('')}</table><button onclick="pb(${i},'row')">+ linha</button>`:`<textarea class="g" style="min-height:60px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px" onchange="pb(${i},'x',this.value)">${esc(b.x)}</textarea>`}<button onclick="pb(${i},'del')">×</button></div>`).join('');
 return `<div class="card"><h2>Espaços e páginas</h2><div style="display:flex;gap:12px;flex-wrap:wrap"><div style="min-width:200px">${side}<button class="p" style="margin-top:10px" onclick="np()">+ Página</button></div><div style="flex:1;min-width:260px"><h2>${esc(c.sp)} › ${esc(c.t)}</h2>${bl}<div style="margin-top:8px">${[['check','Checklist'],['nota','Nota'],['link','Link'],['tab','Tabela']].map(([k,n])=>`<button onclick="pa('${k}')">+ ${n}</button> `).join('')}</div></div></div></div>`}
async function np(){S.pages=S.pages||[];const v=await dlg('Nova página',[{l:'Espaço de trabalho',v:S.pages.length?cp().sp:'Operação SDF1'},{l:'Título da página'}],'Criar','',x=>x[0].trim()&&x[1].trim()?'':'Preencha os dois campos.');if(!v)return;const p={id:'p'+Date.now(),sp:v[0].trim(),t:v[1].trim(),b:[]};S.pages.push(p);S.curp=p.id;save()}
